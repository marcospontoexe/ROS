obstacles_laser:
    observation_sources: laser
    laser: {data_type: LaserScan, clearing: true, marking: true, topic: scan, inf_is_valid: false}
    # track_unknown_space: true #(bool, default: false) If false, each pixel has one of 2 states: lethal obstacle or free. If true, each pixel has one of 3 states: lethal obstacle, free, or unknown. 
    #topic (padrão: source_name): O tópico no qual os dados do sensor chegam para esta fonte.xel has one of 3 states: lethal obstacle, free, or unknown. 
    #topic (padrão: source_name): O tópico no qual os dados do sensor chegam para esta fonte.
    #data_type (padrão: "PointCloud"): O tipo de dados associado ao tópico; atualmente, apenas "PointCloud", "PointCloud2" e "LaserScan" são suportados.
    #clearing (padrão: false): Se esta observação deve ser usada para limpar o espaço livre.
    #marking (padrão: true): Se esta observação deve ser usada para marcar obstáculos.
    #inf_is_valid (padrão: false): false -> valores de distância Inf no scan são ignorados. true -> Os valores Inf são convertidos para o alcance máximo do laser
    #max_obstacle_height (padrão: 2.0): A altura máxima de qualquer obstáculo a ser inserido no costmap, em metros. Este parâmetro deve ser definido ligeiramente maior que a altura do seu robô.
    expected_update_rate:  0.0     # (double, default: 0.0)  frequência mínima esperada com que os dados dos sensores (como o LiDAR) devem ser atualizados. (Se o sensor não publicar novos dados dentro desse intervalo, algo está errado e os dados antigos devem ser considerados desatualizados.). Sempre deixe um pequeno buffer (por exemplo, se publica a 10 Hz, usar 0.15 é mais seguro do que 0.1).
    observation_persistence: 0.0 # (double, default: 0.0)  Define por quanto tempo uma observação (ex: obstáculo detectado pelo sensor) permanece válida antes de ser descartada. Se for 0.0 o dado do sensor é descartado imediatamente após o próximo ciclo.
    obstacle_range: 3.0 # 2.5 (padrão: 2.5): A distância máxima padrão do robô na qual um obstáculo será inserido no costmap, em metros. 
    raytrace_range: 3.5 # 4.0 (padrão: 3.0): define a distância máxima que os raios de sensor irão percorrer para detectar ausencia de obstáculos e limpar o mapa, em metros.
    footprint_clearing_enabled: false  #controla se o espaço ocupado pelo footprint deve ser automaticamente limpo no mapa de custo enquanto o robô se move.
    combination_method: 1 #para determinar como as diferentes camadas de custo são combinadas para gerar o mapa de custo final 
    #1 (Maximização) O valor final do custo em cada célula do mapa é o maior valor entre todas as camadas. Esse é o comportamento padrão e assegura que os obstáculos críticos ou áreas de alto custo de qualquer camada sejam preservados no mapa combinado.
    #0 (Soma) Os custos das células de todas as camadas são somados para produzir o custo final. Isso pode criar mapas mais sensíveis, com áreas de risco cumulativo.
    #99 (nothing) refere-se à ausência de qualquer operação de fusão entre as camadas do mapa de custo. Isso significa que o custo da camada superior não será influenciado pelos valores da camada inferior.

