track_unknown_space: true #true, áreas cinzas do mapa são consideradas areas desconhecidas (-1 na mensagem OccupancyGrid)

footprint_padding: 0.0
#footprint_padding: 0.0 #REMOVED THISSS
robot_radius: 0.0

robot_base_frame: base_link
update_frequency: 1.0 #0.5  (default: 5.0): A frequência em Hz para atualização do mapa.
publish_frequency: 1 #1.0
#static_map: true


resolution: 0.05 #0.036

