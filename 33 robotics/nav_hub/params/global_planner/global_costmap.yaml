global_frame: map
robot_base_frame: base_link
#static_map: true #added new
#rolling_window: false
transform_tolerance: 0.2

# #teste
# # Cost factor for heuristic calculations during path planning
# epsilon: 1.0
# # Distance between points used for path cost calculation (in meters)
# p_calc_dist: 0.1
# # Type of orientation filtering applied to the global plan
# orientation_filter: interpolate

# # Maximum allowed deviation from the goal orientation for orientation filtering (in radians)
# orientation_filter_tolerance: 0.1
# #teste

# track_unknown_space: true
# unknown_cost_value: 255  # Áreas desconhecidas como letais
# lethal_cost_threshold: 254  # Define até onde o custo é letal

# width: 50.0
# hight: 50.0

inflation:
    inflate_unknown: false 
    combination_method: 1
    inflation_radius:  1 #0.32 #0.14 #1.75 #1.8
    cost_scaling_factor: 2.5 #10.5 #11.75 #2.58

obstacles_laser:
  combination_method: 1    
  # quando "combination_method" = 99 
  # * O valor de custo das células das de mais camadas (inflation e static) não são somadas com a camada static, dessa forma  O "raytrace_range" não paga áreas cinzas
  # * Obstáculos que surgem a frente do robo ( na trajetória global) não influenciam uma nova rota global (rota global não é traçada ao redor do obstáculo, e sim como era originalmente)

static:
  combination_method: 1

plugins:
  - {name: static,                    type: "costmap_2d::StaticLayer"}
  - {name: obstacles_laser,           type: "costmap_2d::ObstacleLayer"}
  - {name: inflation,                 type: "costmap_2d::InflationLayer"}
  # - {name: prohibition_layer,         type: "costmap_prohibition_layer::ProhibitionLayer"}
  #- {name: costmap_prohibition_layer, type: "costmap_prohibition_layer_namespace::CostmapProhibitionLayer"}
  
