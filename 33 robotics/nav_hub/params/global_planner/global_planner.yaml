#base_global_planner: "navfn/NavfnROS" # Sets the Navfn Planner
#base_global_planner: "carrot_planner/CarrotPlanner" # Sets the CarrotPlanner
base_global_planner: "global_planner/GlobalPlanner" # Sets the GlobalPlanner

GlobalPlanner:                                  # Also see: http://wiki.ros.org/global_planner
  old_navfn_behavior: false                     # Exactly mirror behavior of navfn, use defaults for other boolean parameters, default false
  # If in some cases, want global_planner fully functional copy navfn, it is set to true, but note navfn is very old ROS system used, it is now used instead of navfn global_planner, so do not recommend setting It is true.
  
  use_quadratic: true                           # Use the quadratic approximation of the potential. Otherwise, use a simpler calculation, default true
  # Set to true, the quadratic function approximation function, otherwise use a more simple method of calculation, which saves hardware computing resources. The default value is true
  # false: cria um plano global beirando borda dos objetos, parecido quando use_grid_path é true, porem mais suave

  use_dijkstra: true                            # Use dijkstra's algorithm. Otherwise, A*, default true
  # Using dijkstra algorithm? Dijkstra algorithm employed is set to true; false to use the A * algorithm. Default: true
  
  use_grid_path: false                        # Create a path that follows the grid boundaries. Otherwise, use a gradient descent method, default false
  # If set to true, the grid plan a route along the border, biased in favor of a straight line across the grid, otherwise, the gradient descent algorithm, the default path smoother points:. False (gradient descent)
  # true: cria um plano global beirando borda dos objetos. 
  # false: cria um plano global entre a borda dos objetos
  
  #representação visual que ajuda a entender como o robô "enxerga" o ambiente e toma decisões sobre qual caminho seguir. Áreas com alto potencial (valores mais altos) representam obstáculos ou regiões a serem evitadas,
  #enquanto áreas com baixo potencial indicam caminhos mais seguros e desejáveis.
  visualize_potential: true  

  allow_unknown: false                           # Allow planner to plan through unknown space, default true
                                                #Needs to have track_unknown_space: true in the obstacle / voxel layer (in costmap_commons_param) to work
                                    
  planner_window_x: 0.0                         # default 0.0
  # Specifies an optional window size to define a working space planner. It facilitates qualified path planning to operate at the expense of large-scale map of a small window
  
  planner_window_y: 0.0                         # default 0.0
  # Specifies an optional window size to define a working space planner. It facilitates qualified path planning to operate at the expense of large-scale map of a small window
  
  default_tolerance: 0.0                        # If goal in obstacle, plan to the closest point in radius default_tolerance, default 0.0
  # When a destination set is occupied by an obstacle, it is necessary to find the parameter is the radius of the nearest point as the new destination point. The default value is 0.0
  
  publish_scale: 100                            # Scale by which the published potential gets multiplied, default 100
  # The release of potential points multiplied by the point scale to calculate the detection, calculated as follows:
  # Grid.data [i] = potential_array_ [i] * publish_scale_ / max, the calculated size is 1-99, all the detected point algorithm
  # https://blog.csdn.net/qq_41906592/article/details/89185808
  
  planner_costmap_publish_frequency: 0.0 #2.0        # default 0.0
  # Planner publish the price chart frequency, default 0.0HZ
  

  lethal_cost: 253   # 150 (int, default: 253).  Marca o limiar acima do qual o planner considera o custo de uma célula impassável (letal). 
  # Apenas células do coastmap que tenham um custo menor que lethal_cost entram na computação de A*/Dijkstra.
  # Um lethal_cost baixo faz muitas células se tornarem intransitáveis → pode não achar caminho.
  # Um lethal_cost alto permite “rasgar” um pouco mais em torno de obstáculos, mas pode acabar passando muito perto de objetos perigosos.
  ##### lethal_cost possui uma relação linear com a distancia entre objetos. Com inflation_radius = 0.7 e cost_scaling_factor = 1.5 no global map: 
  # lethal_cost: 250 ->  não traça rotas entre obstáculos com distancia menor que 40 cm
  # lethal_cost: 200 ->  não traça rotas entre obstáculos com distancia menor que 70 cm
  # lethal_cost: 150 ->  não traça rotas entre obstáculos com distancia menor que 100 cm

    
  cost_factor: 3 # 1  (double, default: 3.) O planner multiplica o custo da célula do coastmap por cost_factor para gerar um custo ponderado (custo_ponderado = cost_factor × c)
  #cost_factor alto → até pequenas diferenças no costmap geram grandes penalidades → evita completamente áreas de custo médio.
  #cost_factor baixo → o plano de fundo “barato” predomina, e diferenças pequenas de custo do mapa impactam pouco.


  neutral_cost: 50   # 0 (int, default: 50). Define um valor de custo “padrão” (neutro) que será usado quando uma célula do costmap tiver custo zero.
  # quando custo do costmap > 0: custo_ponderado = neutral_cost + cost_factor × custo do costmap
  # quando custo do costmap = 0: custo_neutro = neutral_cost
  # Um neutral_cost alto faz até áreas limpas parecerem “caras” → prioriza caminhos curtos geometricamente.
  # Um neutral_cost baixo enfatiza evitar áreas de alto custo, mesmo que o caminho seja mais longo.

  # Neutral_cost moderado faz o robô escolher caminhos mais curtos geometricamente.
  # Cost_factor médio-baixo faz com que obstáculos leves (c ≈ 50) sejam penalizados, mas não evitados a qualquer custo.
  # Lethal_cost ≈ 253 bloqueia apenas células quase letais (c ≈ 254, 255).

  publish_potential: true                       # Publish Potential Costmap (this is not like the navfn pointcloud2 potential), default true
  # Whether to publish costmap potential function.
  
  #teste
  
  # Distance between points used for path cost calculation (in meters)
  #p_calc_dist: 0.1
  # Type of orientation filtering applied to the global plan
  #orientation_filter: interpolate

  # Maximum allowed deviation from the goal orientation for orientation filtering (in radians)
  #orientation_filter_tolerance: 0.1
  #teste
  
  orientation_mode: 0  #F(int, default: 0) (None=0, Forward=1, Interpolate=2, ForwardThenInterpolate=3, Backward=4, Leftward=5, Rightward=6)
  #0	NONE	O planner não calcula nenhuma orientação nos waypoints. Útil se a orientação será controlada por outro nó ou planejador local.
  #1	FORWARD	A orientação dos waypoints será na direção do próximo ponto (seguindo o trajeto). Isso ajuda o robô a sempre "olhar para frente" durante o caminho.
  #2	INTERPOLATE	A orientação é interpolada suavemente entre o início e o fim do caminho. Garante transições suaves.
  #3	FORWARD_THEN_INTERPOLATE	Primeiros pontos com orientação "FORWARD", depois "INTERPOLATE" até o final. Combina os dois comportamentos.
  orientation_window_size: 1    # (int, default: 1) Esse parâmetro define quantos pontos à frente serão considerados para calcular a orientação. Por exemplo, se orientation_window_size: 5, o planner calcula a orientação apontando do ponto atual até o 5º ponto seguinte.

