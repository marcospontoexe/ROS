base_local_planner: "dwa_local_planner/DWAPlannerROS" # Sets the dwa local planner
#base_local_planner: "base_local_planner/TrajectoryPlannerROS" # Sets the Trajectory Rollout algorithm from base local planner
#base_local_planner: "eband_local_planner/EBandPlannerROS" # Sets the eband local planner
#base_local_planner: "teb_local_planner/TebLocalPlannerROS" # Sets the teb local planner


DWAPlannerROS:

  # obstacle_cost_weight: 500.0  # Ajuste conforme necessário
 
# Robot Configuration Parameters - Kobuki
  max_vel_x: 0.3 #0.4
  # min_vel_x: 0.02
  min_vel_x: 0.0

  max_vel_y: 0.0  # diff drive robot
  min_vel_y: 0.0  # diff drive robot

  max_vel_theta: 0.5 #0.40
  #min_vel_theta: 0.10 #-0.40 
  min_vel_theta: 0.05 #-0.40
  # min_in_place_vel_theta: 0.4

  # max_vel_trans: 0.6 # choose slightly less than the base's capability
  # min_vel_trans: 0.1 
  # trans_stopped_vel: 0.1 
  max_vel_trans: 0.3 # choose slightly less than the base's capability
  min_vel_trans: 0.0

  trans_stopped_vel: 0.006  # é a velocidade que considera que o robo está parado. usada quando chega no objetivo final
  theta_stopped_vel: 0.037  
  # Warning!
  #   do not set min_trans_vel to 0.0 otherwise dwa will always think translational velocities
  #   are non-negligible and small in place rotational velocities will be created.


  # acc_lim_x: 0.4 #1.0 # maximum is theoretically 2.0, but we
  # acc_lim_theta: 1.0 #2.0
  acc_lim_x: 0.15 #1.0 # maximum is theoretically 2.0, but we
  acc_lim_theta: 0.3 #2.0
  acc_lim_y: 0.0      # diff drive robot
  acc_lim_trans: 0.15

# Goal Tolerance Parameters
  yaw_goal_tolerance: 0.05 # 0.05  (double, default: 0.05): A tolerância, em radianos, para o controlador de yaw/rotação ao alcançar seu objetivo.
  xy_goal_tolerance: 0.3  # 0.10 (double, default: 0.10): A tolerância, em metros, para o controlador na distância x e y ao alcançar um objetivo.
  latch_xy_goal_tolerance: true
  
  # robot_radius: 0.1 # especifica o raio do robô para fins de planejamento. representa a distância mínima que o robô precisa manter dos obstáculos para evitar colisões, considerando o tamanho real do robô.

# Forward Simulation Parameters
  sim_time: 2.0  # (double, default: 1.7) define o tempo de simulação durante o qual as trajetórias candidatas serão calculadas e avaliadas
  vx_samples: 12  #15 (default: 3): O número de amostras a serem utilizadas ao explorar o espaço de velocidade em x
  vy_samples: 1       # diff drive robot, there is only one sample
  vth_samples: 10  # (default: 20): O número de amostras a serem utilizadas ao explorar o espaço de velocidade em theta

  sim_granularity: 0.025 #0.05  (default: 0.025): O tamanho do passo, em metros, a ser utilizado entre pontos em uma trajetória dada
  angular_sim_granularity: 0.6 #0.05  define a resolução angular utilizada durante a simulação de trajetórias no espaço de busca.
  controller_frequency: 2.0 # define a taxa (em Hz) com que o controlador local de navegação (DWA Planner) é executado para calcular comandos de velocidade para o robô. 


# Trajectory Scoring Parameters
  path_distance_bias: 1000.0        # 32.0   (default: 32.0): O peso para quanto o controlador deve permanecer próximo ao global path.
  goal_distance_bias: 1000.0       # 24.0   (default: 24.0): ODetermina a prioridade do robô em se mover diretamente em direção ao objetivo final, em vez de seguir caminhos alternativos
  occdist_scale: 0.01           # 0.01   (default: 0.01): sse parâmetro ajusta o impacto que a proximidade de obstáculos tem na escolha de trajetórias..
  forward_point_distance: 0.5 #(double, default: 0.325) Representa a distância projetada à frente da posição atual do robô em que ele tenta alinhar sua trajetória.
  stop_time_buffer: 0.1         # (double, default: 0.2)    É o tempo que o robo tem para parar completamente, é o intervalo de desaceleração.
  # min_stop_dist: 0.5  # distancia mínima de parada, ao atingir essa distancia mínima o robo inicia a parada
  scaling_speed: 0.35             # 0.25   - absolute velocity at which to start scaling the robot's footprint
  max_scaling_factor: 0.1       # 0.2    - how much to scale the robot's footprint when at speed.

# Oscillation Prevention Parameters
  oscillation_reset_dist: 0.05  # 0.05   - how far to travel before resetting oscillation flags
  oscillation_reset_angle: 0.017

  
  #TESTE
  # Distance (in meters) that the robot looks ahead when considering the goal orientation
  #heading_lookahead: 0.5
  
  # Whether to consider the heading score in the DWA algorithm
 # heading_scoring: true
  
  # Time step used for scoring the robot's heading in the DWA algorithm
  #heading_scoring_timestep: 0.1
  
  # Whether the planner treats the goal as a simple attractor point or a pose to be reached precisely
  #simple_attractor: false
  #TESTE
  
# Debugging
  publish_traj_pc : true    #publica as trajetórias avaliadas durante o processo de planejamento como uma nuvem de pontos no tópico /move_base/DWAPlannerROS/trajectory_cloud. Cada ponto na nuvem representa uma possível trajetória que o robô pode seguir durante o intervalo de tempo de simulação configurado (sim_time).
  publish_cost_grid_pc: true  # publica a grade de custos local como uma nuvem de pontos (PointCloud) no tópico /move_base/DWAPlannerROS/cost_cloud
  global_frame_id: odom


# Differential-drive robot configuration - necessary?
#  holonomic_robot: false

  # prune_plan: true  #Quando ativado, o DWA Planner remove (ou "poda") os pontos da rota global que o robô já percorreu.
  twirling_scale: 0.0 # está relacionado à penalização de rotações no cálculo da trajetória local. Valores Altos penalizam rotações mais agressivamente.
  use_dwa: true #Se true (padrão): Ativa a Dynamic Window Approach (DWA), que utiliza a janela dinâmica para calcular as trajetórias otimizadas. false: Usa uma abordagem baseada em amostragem (Trajectory Rollout)